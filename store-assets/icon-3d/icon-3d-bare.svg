<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <!-- FISSILE mark, dimensionalised. Variant: bare. Generated from scripts/icon-3d.mjs -->
  <defs>
    <!-- Base colour of the sphere: the favicon's own gradient, untouched. -->
    <radialGradient id="bare-core" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="0.40" stop-color="#6ee6ff"/>
      <stop offset="1" stop-color="#12a8d4"/>
    </radialGradient>

    <!-- Directional shading. Centred up-left, so the far side of the sphere
         sits at the high offsets and goes dark: form shadow, not a vignette. -->
    <radialGradient id="bare-shade" cx="30%" cy="25%" r="98%">
      <stop offset="0.42" stop-color="#032330" stop-opacity="0"/>
      <stop offset="0.78" stop-color="#032330" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#01141d" stop-opacity="0.72"/>
    </radialGradient>

    <!-- Fresnel: a bright lip right at the edge, which is what actually sells
         a sphere. Transparent through the middle so it only touches the rim. -->
    <radialGradient id="bare-rim" cx="50%" cy="50%" r="50%">
      <stop offset="0.72" stop-color="#8df2ff" stop-opacity="0"/>
      <stop offset="0.94" stop-color="#b9f7ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b9f7ff" stop-opacity="0.10"/>
    </radialGradient>

    <radialGradient id="bare-spec" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Nodes keep the flat accent as their body and are shaded on top, for
         the same reason as the core. -->
    <radialGradient id="bare-nodeShade" cx="32%" cy="26%" r="96%">
      <stop offset="0.30" stop-color="#032330" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#032330" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#01141d" stop-opacity="0.78"/>
    </radialGradient>

    <radialGradient id="bare-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- The orbit ring, lit where the key light grazes it. -->
    <linearGradient id="bare-ring" gradientUnits="userSpaceOnUse" x1="13" y1="13" x2="51" y2="51">
      <stop offset="0" stop-color="#8df2ff" stop-opacity="0.72"/>
      <stop offset="0.5" stop-color="#3ad9ff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#8df2ff" stop-opacity="0.6"/>
    </linearGradient>

    <!-- A plate lit from above rather than filled flat. -->
    <linearGradient id="bare-plate" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
      <stop offset="0" stop-color="#141a23"/>
      <stop offset="0.55" stop-color="#0b0e13"/>
      <stop offset="1" stop-color="#04060a"/>
    </linearGradient>

    <radialGradient id="bare-vignette" cx="50%" cy="45%" r="64%">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>

    <linearGradient id="bare-trace0" gradientUnits="userSpaceOnUse" x1="32" y1="22.6" x2="32" y2="15.4">
      <stop offset="0" stop-color="#6ee6ff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#3ad9ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3ad9ff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="bare-trace1" gradientUnits="userSpaceOnUse" x1="32" y1="41.4" x2="32" y2="48.6">
      <stop offset="0" stop-color="#6ee6ff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#3ad9ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3ad9ff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="bare-trace2" gradientUnits="userSpaceOnUse" x1="22.6" y1="32" x2="15.4" y2="32">
      <stop offset="0" stop-color="#6ee6ff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#3ad9ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3ad9ff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="bare-trace3" gradientUnits="userSpaceOnUse" x1="41.4" y1="32" x2="48.6" y2="32">
      <stop offset="0" stop-color="#6ee6ff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#3ad9ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3ad9ff" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  
  
  <circle cx="32" cy="32" r="19" fill="none" stroke="url(#bare-ring)" stroke-width="1"/>
  <path d="M32 22.6 L32 15.4" stroke="url(#bare-trace0)" stroke-width="2.1" stroke-linecap="round" fill="none"/>
  <path d="M32 41.4 L32 48.6" stroke="url(#bare-trace1)" stroke-width="2.1" stroke-linecap="round" fill="none"/>
  <path d="M22.6 32 L15.4 32" stroke="url(#bare-trace2)" stroke-width="2.1" stroke-linecap="round" fill="none"/>
  <path d="M41.4 32 L48.6 32" stroke="url(#bare-trace3)" stroke-width="2.1" stroke-linecap="round" fill="none"/>
  <g>
    <circle cx="32" cy="12" r="3.4" fill="#3ad9ff"/>
    <circle cx="32" cy="12" r="3.4" fill="url(#bare-nodeShade)"/>
    <ellipse cx="30.912" cy="10.708" rx="1.36" ry="0.918" fill="url(#bare-spec)" transform="rotate(-32 30.912 10.708)"/>
  </g>
  <g>
    <circle cx="32" cy="52" r="3.4" fill="#3ad9ff"/>
    <circle cx="32" cy="52" r="3.4" fill="url(#bare-nodeShade)"/>
    <ellipse cx="30.912" cy="50.708" rx="1.36" ry="0.918" fill="url(#bare-spec)" transform="rotate(-32 30.912 50.708)"/>
  </g>
  <g>
    <circle cx="12" cy="32" r="3.4" fill="#3ad9ff"/>
    <circle cx="12" cy="32" r="3.4" fill="url(#bare-nodeShade)"/>
    <ellipse cx="10.912" cy="30.708" rx="1.36" ry="0.918" fill="url(#bare-spec)" transform="rotate(-32 10.912 30.708)"/>
  </g>
  <g>
    <circle cx="52" cy="32" r="3.4" fill="#3ad9ff"/>
    <circle cx="52" cy="32" r="3.4" fill="url(#bare-nodeShade)"/>
    <ellipse cx="50.912" cy="30.708" rx="1.36" ry="0.918" fill="url(#bare-spec)" transform="rotate(-32 50.912 30.708)"/>
  </g>
  <circle cx="32" cy="32" r="10" fill="url(#bare-core)"/>
  <circle cx="32" cy="32" r="10" fill="url(#bare-shade)"/>
  <circle cx="32" cy="32" r="10" fill="url(#bare-rim)"/>
  <ellipse cx="28.4" cy="27.8" rx="3.2" ry="2.1" fill="url(#bare-spec)" transform="rotate(-32 28.4 27.8)"/>
</svg>