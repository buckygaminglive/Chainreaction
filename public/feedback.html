<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="index, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Tester Feedback — FISSILE</title>
    <style>
      :root {
        --bg: #07090c;
        --panel: rgba(255, 255, 255, 0.04);
        --panel-focus: rgba(255, 255, 255, 0.07);
        --hairline: rgba(255, 255, 255, 0.1);
        --text: #e8edf4;
        --dim: #8c97a8;
        --accent: #3ad9ff;
        --accent-dim: rgba(58, 217, 255, 0.15);
        --accent-glow: rgba(58, 217, 255, 0.35);
        --warn: #ffb020;
        --success: #3aff9e;
        --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Segoe UI Mono', 'Roboto Mono', Menlo, Consolas, monospace;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 0 16px 80px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 620px; margin: 0 auto; }
      header { padding: 40px 0 20px; border-bottom: 1px solid var(--hairline); margin-bottom: 24px; }
      .brand {
        font-size: 14px;
        font-weight: 300;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        text-decoration: none;
        color: var(--accent);
        text-transform: uppercase;
      }
      h1 { margin: 14px 0 4px; font-size: clamp(24px, 5vw, 32px); font-weight: 400; letter-spacing: 0.01em; }
      .subtitle { margin: 0; font-size: 13.5px; color: var(--dim); }
      
      .form-group {
        margin-bottom: 20px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #b3bfd0;
        margin-bottom: 8px;
      }
      .label-desc {
        font-size: 12px;
        color: var(--dim);
        font-weight: normal;
        text-transform: none;
        margin-left: 6px;
      }

      /* Radio Categories */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .chip-label {
        cursor: pointer;
        padding: 8px 14px;
        background: var(--panel);
        border: 1px solid var(--hairline);
        border-radius: 20px;
        font-size: 13px;
        color: var(--dim);
        transition: all 0.15s ease;
        text-transform: none;
        margin-bottom: 0;
        user-select: none;
      }
      .chip-input { display: none; }
      .chip-input:checked + .chip-label {
        background: var(--accent-dim);
        border-color: var(--accent);
        color: var(--accent);
        font-weight: 600;
      }

      /* Stars Rating */
      .star-rating {
        display: flex;
        gap: 6px;
        font-size: 30px;
        cursor: pointer;
        user-select: none;
      }
      .star {
        color: #313a48;
        transition: color 0.15s ease, transform 0.1s ease;
      }
      .star.active { color: var(--warn); }
      .star:hover { transform: scale(1.15); }

      /* Inputs & Textareas */
      input[type="text"], input[type="email"], textarea {
        width: 100%;
        background: var(--panel);
        border: 1px solid var(--hairline);
        border-radius: 8px;
        padding: 12px 14px;
        color: var(--text);
        font-size: 14.5px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      input[type="text"]:focus, input[type="email"]:focus, textarea:focus {
        border-color: var(--accent);
        background: var(--panel-focus);
        box-shadow: 0 0 0 2px var(--accent-glow);
      }
      textarea {
        resize: vertical;
        min-height: 110px;
        line-height: 1.5;
      }

      /* File upload / Screenshot & Video drop */
      .file-drop {
        border: 2px dashed var(--hairline);
        border-radius: 10px;
        padding: 22px 16px;
        text-align: center;
        background: var(--panel);
        cursor: pointer;
        transition: all 0.2s ease;
        user-select: none;
      }
      .file-drop:hover, .file-drop.dragover {
        border-color: var(--accent);
        background: var(--accent-dim);
      }
      .file-drop p {
        margin: 0;
        font-size: 13.5px;
        color: var(--dim);
        pointer-events: none;
      }
      .file-drop .browse-btn {
        color: var(--accent);
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      #file-input { display: none; }
      
      /* Preview container */
      .preview-container {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }
      .thumb-wrap {
        position: relative;
        width: 90px;
        height: 90px;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid var(--hairline);
        background: #0d1117;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .thumb-wrap img, .thumb-wrap video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .thumb-meta {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.7);
        font-size: 9.5px;
        color: #fff;
        padding: 2px 4px;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .remove-thumb {
        position: absolute;
        top: 3px;
        right: 3px;
        background: rgba(0, 0, 0, 0.85);
        color: #ff3355;
        border: 1px solid rgba(255, 51, 85, 0.4);
        border-radius: 50%;
        width: 22px;
        height: 22px;
        font-size: 14px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
      }

      /* Diagnostic details box */
      .diagnostics-box {
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--hairline);
        border-radius: 8px;
        padding: 12px 14px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--dim);
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .diag-refresh {
        display: inline-block;
        font-size: 11px;
        color: var(--accent);
        cursor: pointer;
        margin-top: 4px;
        text-decoration: underline;
      }

      /* Action Buttons */
      .btn-row {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 24px;
      }
      @media (min-width: 480px) {
        .btn-row { flex-direction: row; }
      }
      .primary-btn {
        flex: 1;
        background: var(--accent);
        color: #07090c;
        border: none;
        border-radius: 8px;
        padding: 14px 20px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
        transition: transform 0.1s ease, filter 0.15s ease;
      }
      .primary-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
      .primary-btn:active { transform: translateY(0); }

      .secondary-btn {
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--hairline);
        border-radius: 8px;
        padding: 14px 18px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        text-align: center;
        transition: background 0.15s ease;
      }
      .secondary-btn:hover { background: rgba(255, 255, 255, 0.08); }

      .toast {
        display: none;
        background: rgba(58, 255, 158, 0.12);
        border: 1px solid var(--success);
        color: var(--success);
        border-radius: 8px;
        padding: 12px 16px;
        margin-top: 16px;
        font-size: 13.5px;
        text-align: center;
        line-height: 1.5;
      }

      footer { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--hairline); font-size: 13px; text-align: center; color: var(--dim); }
      footer a { color: var(--accent); text-decoration: none; }
      footer a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <a class="brand" href="/">FISSILE</a>
        <h1>Closed Tester Feedback</h1>
        <p class="subtitle">Design Dynasty Studios · Help us refine and polish the game</p>
      </header>

      <form id="feedback-form">
        
        <!-- Category -->
        <div class="form-group">
          <label>Feedback Category</label>
          <div class="chips">
            <input type="radio" id="cat-bug" name="category" value="Bug Report" class="chip-input" checked />
            <label for="cat-bug" class="chip-label">🐛 Bug Report</label>

            <input type="radio" id="cat-gameplay" name="category" value="Gameplay & Balance" class="chip-input" />
            <label for="cat-gameplay" class="chip-label">⚖️ Gameplay & Balance</label>

            <input type="radio" id="cat-feature" name="category" value="Feature Suggestion" class="chip-input" />
            <label for="cat-feature" class="chip-label">💡 Feature Idea</label>

            <input type="radio" id="cat-perf" name="category" value="Performance / Lag" class="chip-input" />
            <label for="cat-perf" class="chip-label">⚡ Performance</label>

            <input type="radio" id="cat-other" name="category" value="General Feedback" class="chip-input" />
            <label for="cat-other" class="chip-label">💬 General</label>
          </div>
        </div>

        <!-- Rating -->
        <div class="form-group">
          <label>Overall Experience <span class="label-desc">(Rate the current build)</span></label>
          <div class="star-rating" id="star-group">
            <span class="star active" data-value="1">★</span>
            <span class="star active" data-value="2">★</span>
            <span class="star active" data-value="3">★</span>
            <span class="star active" data-value="4">★</span>
            <span class="star active" data-value="5">★</span>
          </div>
          <input type="hidden" id="rating-val" value="5" />
        </div>

        <!-- Description -->
        <div class="form-group">
          <label for="feedback-text">Your Feedback / Bug Description <span style="color:var(--warn)">*</span></label>
          <textarea id="feedback-text" required placeholder="What happened? What did you like? What needs improvement or felt off?"></textarea>
        </div>

        <!-- Email (Optional) -->
        <div class="form-group">
          <label for="user-email">Your Email <span class="label-desc">(Optional, if you'd like a reply)</span></label>
          <input type="email" id="user-email" placeholder="your-email@gmail.com" />
        </div>

        <!-- Screenshots / Screen Recordings -->
        <div class="form-group">
          <label>Screenshots & Screen Recordings <span class="label-desc">(Optional)</span></label>
          <div class="file-drop" id="drop-zone">
            <p>📷 🎥 Drag & drop screenshots or videos here, or <span class="browse-btn">browse files</span></p>
          </div>
          <input type="file" id="file-input" accept="image/*,video/*" multiple />
          <div class="preview-container" id="preview-list"></div>
        </div>

        <!-- System Diagnostics -->
        <div class="form-group">
          <label>Auto-Captured Diagnostics <span class="label-desc">(Helps developer reproduce issues)</span></label>
          <div class="diagnostics-box" id="diag-box">Detecting device diagnostics...</div>
          <span class="diag-refresh" onclick="initDiagnostics()">↻ Re-detect device info</span>
        </div>

        <div class="btn-row">
          <button type="button" id="submit-btn" class="primary-btn" onclick="submitFeedback()">Send Feedback via Email</button>
          <button type="button" class="secondary-btn" onclick="copyReport()">📋 Copy Full Report</button>
        </div>

        <div id="toast-msg" class="toast"></div>
      </form>

      <footer>
        <a href="/">← Return to FISSILE</a> · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a>
      </footer>
    </main>

    <script>
      // Rating Stars Handler
      let currentRating = 5;
      const stars = document.querySelectorAll('.star');
      stars.forEach(star => {
        star.addEventListener('click', () => {
          currentRating = parseInt(star.getAttribute('data-value'));
          document.getElementById('rating-val').value = currentRating;
          updateStars();
        });
      });

      function updateStars() {
        stars.forEach(star => {
          const val = parseInt(star.getAttribute('data-value'));
          star.classList.toggle('active', val <= currentRating);
        });
      }

      // Comprehensive Device Diagnostics
      let diagText = '';
      function initDiagnostics() {
        const ua = navigator.userAgent;
        const screenRes = `${window.screen.width}x${window.screen.height} (Pixel Ratio: ${window.devicePixelRatio || 1})`;
        const viewport = `${window.innerWidth}x${window.innerHeight}`;
        const orientation = (screen.orientation && screen.orientation.type) || (window.innerWidth > window.innerHeight ? 'landscape' : 'portrait');
        const touchSupport = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) ? `Yes (${navigator.maxTouchPoints || 1} points)` : 'No';
        const platform = navigator.platform || 'Unknown';
        const lang = navigator.language || 'en';

        // GPU / WebGL detection
        let gpuRenderer = 'Unavailable';
        try {
          const canvas = document.createElement('canvas');
          const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
          if (gl) {
            const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
            if (debugInfo) {
              gpuRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
            }
          }
        } catch (e) {}

        diagText = `• Device Screen: ${screenRes}\n• Viewport: ${viewport} (${orientation})\n• Touch Support: ${touchSupport}\n• GPU Renderer: ${gpuRenderer}\n• OS/Platform: ${platform}\n• Browser Agent: ${ua}\n• Language: ${lang}\n• Timestamp: ${new Date().toLocaleString()}`;
        document.getElementById('diag-box').innerText = diagText;
      }
      initDiagnostics();

      // File Selection & Drag-and-Drop
      const attachedFiles = [];
      const fileInput = document.getElementById('file-input');
      const dropZone = document.getElementById('drop-zone');

      dropZone.addEventListener('click', () => { fileInput.click(); });
      dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files) handleFiles(e.dataTransfer.files);
      });

      fileInput.addEventListener('change', function() {
        if (this.files) handleFiles(this.files);
      });

      function handleFiles(files) {
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          attachedFiles.push(file);
          const fileIndex = attachedFiles.length - 1;

          const container = document.getElementById('preview-list');
          const wrap = document.createElement('div');
          wrap.className = 'thumb-wrap';
          wrap.id = `thumb-${fileIndex}`;

          const sizeKb = (file.size / 1024).toFixed(1) + ' KB';

          if (file.type.startsWith('video/')) {
            const video = document.createElement('video');
            video.src = URL.createObjectURL(file);
            video.muted = true;
            wrap.appendChild(video);
          } else {
            const img = document.createElement('img');
            img.src = URL.createObjectURL(file);
            wrap.appendChild(img);
          }

          const meta = document.createElement('div');
          meta.className = 'thumb-meta';
          meta.innerText = `${file.name.substring(0, 10)} (${sizeKb})`;
          wrap.appendChild(meta);

          const removeBtn = document.createElement('button');
          removeBtn.className = 'remove-thumb';
          removeBtn.innerText = '×';
          removeBtn.type = 'button';
          removeBtn.onclick = (e) => {
            e.stopPropagation();
            wrap.remove();
            const idx = attachedFiles.indexOf(file);
            if (idx > -1) attachedFiles.splice(idx, 1);
          };
          wrap.appendChild(removeBtn);

          container.appendChild(wrap);
        }
      }

      function generateReport() {
        const category = document.querySelector('input[name="category"]:checked').value;
        const rating = document.getElementById('rating-val').value;
        const text = document.getElementById('feedback-text').value.trim() || 'No text provided';
        const email = document.getElementById('user-email').value.trim() || 'Not provided';
        const fileNames = attachedFiles.map(f => `${f.name} (${(f.size/1024).toFixed(1)} KB)`).join(', ') || 'None';

        return `====================================\n[FISSILE CLOSED TEST FEEDBACK]\n====================================\nCategory: ${category}\nRating: ${rating}/5 Stars\nTester Email: ${email}\nAttached Media: ${fileNames}\n\nFEEDBACK / ISSUE DESCRIPTION:\n${text}\n\n------------------------------------\nDEVICE & HARDWARE DIAGNOSTICS:\n${diagText}\n====================================`;
      }

      function submitFeedback() {
        const text = document.getElementById('feedback-text').value.trim();
        if (!text) {
          alert('Please enter your feedback or description before sending.');
          document.getElementById('feedback-text').focus();
          return;
        }

        const category = document.querySelector('input[name="category"]:checked').value;
        const subject = encodeURIComponent(`[FISSILE Feedback] ${category} (${currentRating}/5 Stars)`);
        const body = encodeURIComponent(generateReport() + (attachedFiles.length > 0 ? '\n\n*Note for Tester: Please attach your screenshots/video to this email.*' : ''));

        // Open email client
        window.location.href = `mailto:Designxdynastystudios@gmail.com?subject=${subject}&body=${body}`;

        showToast('✓ Email client opened! If you have screenshots/recordings, please attach them and click Send.');
      }

      function copyReport() {
        const report = generateReport();
        navigator.clipboard.writeText(report).then(() => {
          showToast('✓ Full diagnostic report copied to clipboard! You can paste it into Discord, WhatsApp, or email.');
        }).catch(() => {
          showToast('✓ Report ready: check email draft.');
        });
      }

      function showToast(msg) {
        const t = document.getElementById('toast-msg');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 7000);
      }
    </script>
  </body>
</html>
